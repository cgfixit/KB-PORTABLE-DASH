name: Release macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS .app
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      REQUIRE_DEVELOPER_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Import Developer ID
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash scripts/ci-import-developer-id.sh
      - name: Build .app and zip
        run: bash scripts/build-macos-app.sh
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          TAG="macos-${SHA7}"
          MODE="$(cat dist/signing-mode.txt)"
          if [ "$MODE" = "developer-id-notarized" ]; then
            NOTES="macOS Apple Silicon .app, Developer ID signed and notarized. Data and config.toml live next to the .app."
          else
            echo "main release must be developer-id-notarized, got $MODE" >&2
            exit 1
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "KB-Portable-DASH ${SHA7}" \
            --generate-notes \
            --notes "$NOTES" \
            "dist/KB-Portable-DASH-macos.zip#KB-Portable-DASH-macos.zip"
