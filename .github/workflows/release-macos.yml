name: Release macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: macOS .app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build .app and zip
        run: bash scripts/build-macos-app.sh
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          TAG="macos-${SHA7}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "KB-Portable-DASH ${SHA7}" \
            --generate-notes \
            --notes "macOS Apple Silicon .app (ad-hoc signed, not notarized). Unzip, then right-click Open the first time. Data and config.toml live next to the .app." \
            "dist/KB-Portable-DASH-macos.zip#KB-Portable-DASH-macos.zip"
